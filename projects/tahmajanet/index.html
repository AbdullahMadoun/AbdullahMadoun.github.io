<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tahmajanet — Project details">
  <title>Tahmajanet — Abdullah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card: #fafafa;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #090a0f; --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a; --card: #12131a; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.5rem 6rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 680px; margin: 0 auto; }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: .875rem;
    }
    .brand { color: var(--text); text-decoration: none; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .brand::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: .5rem; border-radius: 50%; background: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    header { padding: 4rem 0 2rem; }
    h1 {
      margin: 0 0 1.25rem;
      font-family: Newsreader, Georgia, serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .98;
    }
    main p { color: var(--text); }
    main a { color: var(--accent); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    .back-link { display: inline-block; margin-top: 2rem; color: var(--muted); font-size: .9rem; text-decoration: none; }
    .back-link:hover { color: var(--accent); }
    footer { margin-top: 5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a class="brand" href="../../">Abdullah</a>
      <a href="https://github.com/AbdullahMadoun" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>

    <header>
      <h1>Tahmajanet</h1>
    </header>

    <main>
      <p>A project exploring distributed systems and network architectures.</p>
      
      <p>More details coming soon...</p>

      <a href="../../" class="back-link">← Back to home</a>
    </main>

    <footer>
      Built by Abdullah
    </footer>
  </div>
</body>
</html>
